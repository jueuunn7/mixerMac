name: Deploy project page
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/assets/**'
      - 'script/build_site.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble the static site
        shell: bash
        run: |
          mkdir -p work/pages-site/assets
          cp site/index.html site/styles.css site/app.js work/pages-site/
          cp docs/assets/app-icon.png docs/assets/console.png docs/assets/detail.png work/pages-site/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: work/pages-site
      - uses: actions/deploy-pages@v5
        id: deployment
